<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>OptimLLM</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <div class="sidebar-header">
          <a class="brand" href="/" aria-label="OptimLLM home">
            <span class="brand-mark">O</span>
            <span>OptimLLM</span>
          </a>
          <button class="icon-button mobile-only" id="closeSidebarButton" type="button" aria-label="Close sidebar">×</button>
        </div>

        <button class="new-chat-button" id="newChatButton" type="button">
          <span aria-hidden="true">＋</span>
          New chat
        </button>

        <div class="history-label">Recent</div>
        <nav class="chat-history" id="chatHistory" aria-label="Previous chats"></nav>

        <div class="sidebar-footer">
          <button class="auto-mode-button" id="enableAutoModeButton" type="button">
            <span class="auto-mode-icon">✦</span>
            <span>
              <strong>Enable auto mode</strong>
              <small id="autoModeStatus">Configure local intelligence</small>
            </span>
          </button>
          <button class="export-feedback-button" id="exportFeedbackButton" type="button">
            <span>Export router data</span>
            <small id="feedbackCount">0 examples</small>
          </button>
          <div class="model-picker" id="modelPicker">
            <div class="model-menu" id="modelMenu" role="menu" aria-label="Choose a model" hidden></div>
          </div>
          <button class="routing-status" id="modelPickerButton" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="status-dot" id="routingStatusDot"></span>
            <span class="routing-status-copy">
              <strong id="routingModeLabel">Automatic routing</strong>
              <small id="routingStatusText">Finding the best model</small>
            </span>
            <span class="routing-chevron" aria-hidden="true">⌃</span>
          </button>
        </div>
      </aside>

      <section class="main-panel">
        <header class="topbar">
          <button class="icon-button menu-button" id="openSidebarButton" type="button" aria-label="Open sidebar">☰</button>
          <div class="chat-title-wrap">
            <h1 id="activeChatTitle">New chat</h1>
            <p id="selectedModelSummary">OptimLLM chooses the best available model automatically.</p>
          </div>
          <button class="text-button" id="clearChatButton" type="button">Clear chat</button>
        </header>

        <section class="chat-panel" aria-label="OptimLLM chat">
          <div id="messages" class="messages" aria-live="polite">
            <div class="empty-state" id="emptyState">
              <div class="empty-mark">O</div>
              <h2>How can I help?</h2>
              <p>Ask a question, explore an idea, or work through a problem.</p>
            </div>
          </div>

          <div class="composer-wrap">
            <form id="chatForm" class="composer">
              <textarea id="promptInput" rows="1" placeholder="Message OptimLLM" aria-label="Message OptimLLM"></textarea>
              <button class="send-button" type="submit" aria-label="Send message">
                <span aria-hidden="true">↑</span>
              </button>
            </form>
            <p class="composer-note">OptimLLM can make mistakes. Check important information.</p>
          </div>
        </section>
      </section>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
